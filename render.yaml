services:
  - type: web
    name: transaction-ledger-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /openapi.json
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
